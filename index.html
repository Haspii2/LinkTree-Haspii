  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Direction artistique calquée sur akio.cash : police système + Technor,
       verre sans teinte, bordures fines et nettes, accents verts façon Discord */
    :root {
      --bg: #000;
      --txt: #fff;
      --pill-line: #99a1af;   /* bord des pastilles */
      --avatar-line: #6a7282; /* bord de l'avatar */
      --online: #23a559;      /* pastille « Online » */
      --join: #00a63e;
      --join-hover: #00c950;
      --ease: cubic-bezier(.4, 0, .2, 1);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      --technor: "Technor", sans-serif;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--txt);
      /* scroll vertical autorisé : sur un écran bas, la carte reste lisible en entier */
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none; user-select: none;
    }
    img, video, svg, a { -webkit-user-drag: none; }

    /* navigation clavier : focus visible sans polluer le clic souris */
    a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid rgba(255,255,255,.75);
      outline-offset: 3px;
      border-radius: 10px;
    }

    /* ============ CURSEUR : un point blanc (souris uniquement) ============ */
    @media (pointer: fine) {
      html, body, a, button, [role="button"] { cursor: none; }
    }
    .cursor {
      position: fixed; top: 0; left: 0; z-index: 200;
      width: 8px; height: 8px; border-radius: 50%;
      background: #fff;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .cursor.is-on { opacity: 1; }

    /* ============ FOND VIDÉO PLEIN ÉCRAN ============ */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: var(--bg);
      overflow: hidden;
    }
    .bg video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .bg.is-loaded video { opacity: 1; }

    /* ============ SCÈNE ============ */
    /* la carte apparaît en fondu au clic (500 ms), comme sur akio.cash */
    .scene {
      position: relative; z-index: 10;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 28px 20px;
      opacity: 0; visibility: hidden;
      transition: opacity .5s var(--ease), visibility 0s linear .5s;
    }
    body.entered .scene {
      opacity: 1; visibility: visible;
      transition: opacity .5s var(--ease);
    }
    .stack { width: 100%; max-width: 620px; }

    /* ============ CARTE PRINCIPALE ============ */
    /* verre sans teinte : seul le flou de la vidéo fait la matière de la carte */
    .card {
      --banner-h: 256px;
      --avatar: 120px;
      position: relative;
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.1), 0 15px 40px rgba(0,0,0,.6);
      overflow: hidden; /* arrondis propres pour la bannière */
      padding-bottom: 32px;
      will-change: transform;
    }

    /* ---- bannière vidéo ----
       Aucune ligne de séparation : la vidéo se dissout dans la carte en 3 couches.
       1. .banner : masque elliptique (le fondu s'incurve sur les côtés) dont
          l'opacité suit une courbe « smootherstep ». Sa pente est nulle au début
          et à la fin du fondu : pas de cassure, donc pas de ligne visible.
       2. .glow : copie floutée de la vidéo (cf. ambientGlow en JS) qui prolonge
          ses couleurs plus bas dans la carte, comme un « mode ambiant ».
       3. le verre de la carte, qui prend le relais. */
    .banner {
      position: relative; z-index: 1;
      height: var(--banner-h);
      -webkit-mask-image: radial-gradient(150% 100% at 50% 0%, #000 45%, rgba(0,0,0,.984) 51.9%, rgba(0,0,0,.896) 58.8%, rgba(0,0,0,.725) 65.6%, rgba(0,0,0,.5) 72.5%, rgba(0,0,0,.275) 79.4%, rgba(0,0,0,.104) 86.3%, rgba(0,0,0,.016) 93.1%, transparent 100%);
      mask-image: radial-gradient(150% 100% at 50% 0%, #000 45%, rgba(0,0,0,.984) 51.9%, rgba(0,0,0,.896) 58.8%, rgba(0,0,0,.725) 65.6%, rgba(0,0,0,.5) 72.5%, rgba(0,0,0,.275) 79.4%, rgba(0,0,0,.104) 86.3%, rgba(0,0,0,.016) 93.1%, transparent 100%);
    }
    .banner video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .banner.is-loaded video { opacity: 1; }
    .glow {
      position: absolute; top: 0; left: 0; z-index: 0;
      width: 100%; height: calc(var(--banner-h) * 1.6);
      pointer-events: none;
      opacity: 0;
      filter: blur(24px) saturate(1.25) brightness(.85);
      -webkit-mask-image: linear-gradient(to bottom, #000 45%, rgba(0,0,0,.984) 51.9%, rgba(0,0,0,.896) 58.8%, rgba(0,0,0,.725) 65.6%, rgba(0,0,0,.5) 72.5%, rgba(0,0,0,.275) 79.4%, rgba(0,0,0,.104) 86.3%, rgba(0,0,0,.016) 93.1%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 45%, rgba(0,0,0,.984) 51.9%, rgba(0,0,0,.896) 58.8%, rgba(0,0,0,.725) 65.6%, rgba(0,0,0,.5) 72.5%, rgba(0,0,0,.275) 79.4%, rgba(0,0,0,.104) 86.3%, rgba(0,0,0,.016) 93.1%, transparent 100%);
      transition: opacity 1.4s ease;
    }
    .glow.is-on { opacity: .45; }
    /* pas de bannière configurée (ou vidéo en erreur) : layout d'origine */
    .card.no-banner .banner, .card.no-banner .glow { display: none; }
    .card.no-banner .content { margin-top: 0; padding-top: 30px; }

    /* ---- contenu ---- */
    .content {
      position: relative; z-index: 2;
      padding: 0 32px;
      margin-top: calc(var(--avatar) / -2); /* le centre de l'avatar se pose sur le bas de la bannière */
    }

    /* ---- entête identité ---- */
    .id-head { display: flex; flex-direction: column; align-items: center; text-align: center; }

    .avatar {
      width: var(--avatar); height: var(--avatar); border-radius: 50%;
      position: relative; overflow: hidden; flex: none;
      background: #0a0c0e;
      border: 1px solid var(--avatar-line);
      box-shadow: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
    }
    .avatar video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scale(1.75);
    }

    /* nom + pseudo : glissent depuis la gauche juste après l'ouverture */
    .bio {
      display: flex; flex-direction: column; align-items: center;
      margin-top: 14px;
      opacity: 0; transform: translateX(-40px);
      transition: opacity .5s var(--ease), transform .5s var(--ease);
    }
    body.revealed .bio { opacity: 1; transform: none; }
    h1 { font-size: 20px; line-height: 28px; font-weight: 700; }
    .handle {
      margin-top: 12px;
      border: 1px solid var(--pill-line);
      border-radius: 9999px;
      background: rgba(0,0,0,.4);
      padding: 4px 12px;
      font-size: 14px; line-height: 20px;
    }

    /* ---- machine à écrire (Technor, curseur « | » qui respire) ---- */
    .tagline {
      margin-top: 16px; min-height: 24px;
      font-family: var(--technor);
      font-size: 16px; line-height: 24px;
    }
    .typewriter-cursor {
      margin-left: 1px;
      animation: typeCursor 1s infinite;
    }

    /* ---- carte serveur Discord ---- */
    .server {
      margin-top: 24px;
      border-radius: 32px;
      border: 1px solid #fff;
      background: rgba(0,0,0,.2);
      padding: 16px 12px;
      display: flex; align-items: center; gap: 16px;
      font-family: var(--technor);
    }
    .server-logo {
      width: 64px; height: 64px; border-radius: 16px; overflow: hidden; flex: none;
    }
    .server-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .server-meta { flex: 1; min-width: 0; text-align: left; }
    .server-meta h2 { font-size: 16px; line-height: 24px; font-weight: 600; }
    .members {
      display: flex; flex-wrap: wrap; gap: 2px 8px; /* passe à la ligne sur petit écran */
      font-size: 12px; line-height: 16px;
    }
    .stat { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .stat svg { width: 1em; height: 1em; }
    .stat.online svg { color: var(--online); }
    .join {
      flex: none; margin-right: 8px;
      background: var(--join); color: #fff;
      border-radius: 9999px;
      padding: 5px 16px; text-decoration: none;
      font-size: 12px; line-height: 16px;
      transition: background-color .3s var(--ease);
    }
    .join:hover { background: var(--join-hover); }

    /* ---- réseaux : la carte s'agrandit pendant que les icônes descendent (1,5 s) ---- */
    .socials-wrap {
      max-height: 0; overflow: hidden;
      transition: max-height 1.5s var(--ease);
    }
    body.revealed .socials-wrap { max-height: 160px; }
    body.settled .socials-wrap { overflow: visible; } /* l'infobulle « copié ✓ » peut dépasser */
    .socials {
      margin-top: 20px;
      display: flex; justify-content: center; align-items: center; gap: 32px;
      opacity: 0; transform: translateY(-20px);
      transition: opacity 1.5s var(--ease), transform 1.5s var(--ease);
    }
    body.revealed .socials { opacity: 1; transform: none; }
    .social {
      color: var(--txt); text-decoration: none;
      display: grid; place-items: center;
      transition: transform .3s var(--ease), color .3s var(--ease);
    }
    .social svg { width: 40px; height: 40px; }
    .social:hover { transform: scale(1.1); }

    /* icône « copie » (ex. Monero) : même look, retour vert + infobulle */
    .social-copy { position: relative; background: none; border: 0; padding: 0; font: inherit; }
    .social-copy::after {
      content: "copié ✓";
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translate(-50%, 4px);
      font-family: var(--technor); font-size: 12px; line-height: 16px;
      color: #fff; white-space: nowrap;
      background: rgba(0,0,0,.4);
      border: 1px solid var(--online);
      border-radius: 9999px; padding: 3px 10px;
      opacity: 0; pointer-events: none;
      transition: opacity .3s var(--ease), transform .3s var(--ease);
    }
    .social-copy.copied::after { opacity: 1; transform: translate(-50%, 0); }
    .social-copy.copied { color: var(--online); }

    /* ---- pied de carte : vues ---- */
    .card-foot {
      margin-top: 20px;
      display: flex; align-items: center;
    }
    .views {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 12px; line-height: 16px; font-weight: 600;
    }
    .views svg { width: 16px; height: 16px; }

    /* ============ INTRO ============ */
    .intro {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity .5s var(--ease), visibility .5s;
    }
    .intro.leaving { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-cta {
      padding: 12px 20px; border-radius: 6px;
      font-size: clamp(28px, 8vw, 48px); line-height: 1; font-weight: 700;
      text-transform: uppercase; letter-spacing: 2px; white-space: nowrap;
      text-shadow: 0 0 10px rgba(245,245,247,.9);
      animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite;
    }

    /* ============ SPARKLES CURSEUR ============ */
    .spark {
      position: fixed; z-index: 90; pointer-events: none;
      width: 3px; height: 3px; border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px rgba(255,255,255,.9);
      animation: sparkFade .7s ease-out forwards;
    }
    @keyframes sparkFade {
      from { opacity: .9; transform: translate(0,0) scale(1); }
      to   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); }
    }

    /* ============ ANIMATIONS ============ */
    @keyframes pulse { 50% { opacity: .5; } }
    @keyframes typeCursor { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 560px) {
      .card { --banner-h: 200px; --avatar: 100px; }
      .content { padding: 0 20px; }
      .card.no-banner .content { padding-top: 24px; }
      .server { gap: 12px; padding: 14px 12px; }
      .server-logo { width: 56px; height: 56px; border-radius: 14px; }
      .join { margin-right: 4px; padding: 5px 12px; }
      .socials { gap: 24px; }
      .social svg { width: 36px; height: 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

    youtube:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.5s-.2-1.6-.9-2.3c-.9-.9-1.9-.9-2.3-1C16.6 4 12 4 12 4s-4.6 0-7.8.2c-.4.1-1.4.1-2.3 1-.7.7-.9 2.3-.9 2.3S.8 9.4.8 11.3v1.4c0 1.9.2 3.8.2 3.8s.2 1.6.9 2.3c.9.9 2 .9 2.5 1 1.8.2 7.6.2 7.6.2s4.6 0 7.8-.2c.4-.1 1.4-.1 2.3-1 .7-.7.9-2.3.9-2.3s.2-1.9.2-3.8v-1.4c0-1.9-.2-3.8-.2-3.8zM9.8 15.2V8.7l6.1 3.3-6.1 3.2z"/></svg>',
    x:        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.4L6.4 22H3.3l7.3-8.3L1.6 2H8l4.4 5.9L18.9 2zm-1.1 18h1.7L7.1 3.7H5.3L17.8 20z"/></svg>',
    mail:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
    monero:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.365 0 0 5.373 0 12.015c0 1.335.228 2.607.618 3.81h3.577V5.729L12 13.545l7.805-7.815v10.095h3.577c.389-1.203.618-2.475.618-3.81C24 5.373 18.635 0 12 0zm-1.788 15.307l-3.417-3.421v6.351H1.758C3.87 21.689 7.678 24 12 24s8.162-2.311 10.242-5.763h-5.037v-6.351l-3.417 3.421-1.788 1.79-1.788-1.79z"/></svg>',
  };

  /* ================================================================
     Rendu depuis la config
     ================================================================ */
  const $ = (id) => document.getElementById(id);

  document.title = CONFIG.name;
  $("name").textContent = CONFIG.name;
  $("handle").textContent = CONFIG.handle;

  /* Vidéos — optimisation Cloudinary : compression (q_auto) + largeur plafonnée
     (c_limit) adaptées à la taille d'affichage réelle. Le fichier reste un MP4
     H.264, lisible partout (iOS Safari compris). Les URLs déjà transformées ou
     non-Cloudinary sont laissées telles quelles. */
  function cldOptimize(url, width) {
    if (!url.includes("res.cloudinary.com")) return url;
    const m = url.match(/^(.+\/video\/upload\/)([^/]+)(\/.+)$/);
    // si le segment après /upload/ n'est pas la version (v123…), une
    // transformation est déjà présente : on ne touche pas à l'URL
    if (!m || !/^v\d+$/.test(m[2])) return url;
    return `${m[1]}q_auto,c_limit,w_${width}/${m[2]}${m[3]}`;
  }

  /* Crée une vidéo décorative : muette, en boucle, inline (obligatoire pour
     l'autoplay mobile), relancée au premier tap si l'autoplay est refusé. */
  function makeVideo(src, width, onReady, onError) {
    const v = document.createElement("video");
    v.src = cldOptimize(src, width);
    v.autoplay = true; v.muted = true; v.loop = true;
    v.playsInline = true; v.preload = "auto";
    v.setAttribute("webkit-playsinline", "");
    v.setAttribute("disablepictureinpicture", "");
    v.setAttribute("disableremoteplayback", "");
    if (onReady) {
      let revealed = false;
      const reveal = () => { if (!revealed) { revealed = true; onReady(); } };
      v.addEventListener("canplay", reveal, { once: true });
      v.addEventListener("loadeddata", reveal, { once: true });
    }
    if (onError) v.addEventListener("error", onError, { once: true });
    const p = v.play();
    if (p && p.catch) p.catch(() => {
      document.addEventListener("pointerdown", () => v.play().catch(() => {}), { once: true });
    });
    return v;
  }

  const bg = $("bg");
  bg.appendChild(makeVideo(CONFIG.backgroundVideo, 1440, () => bg.classList.add("is-loaded")));
  $("avatar").appendChild(makeVideo(CONFIG.avatarVideo, 320));

  // Bannière : fondue dans la carte ; si absente ou en erreur, la carte
  // retombe proprement sur le layout sans bannière
  const banner = $("banner");
  if (CONFIG.bannerVideo) {
    const bannerVideo = makeVideo(
      CONFIG.bannerVideo, 760,
      () => { banner.classList.add("is-loaded"); ambientGlow(bannerVideo); },
      () => $("card").classList.add("no-banner")
    );
    banner.appendChild(bannerVideo);
  } else {
    $("card").classList.add("no-banner");
  }

  /* Halo ambiant : la bannière est recopiée ~15 fois/s dans un canvas
     minuscule, que le CSS floute et étire sous la vidéo. Ses couleurs
     débordent ainsi dans la carte, là où la vidéo s'efface. Le canvas est
     "tainted" (vidéo cross-origin) : sans conséquence, on ne relit jamais
     ses pixels. */
  function ambientGlow(video) {
    const glow = $("glow");
    const ctx = glow.getContext("2d");
    if (!ctx) return;
    let last = 0;
    (function frame(now) {
      requestAnimationFrame(frame);
      if (now - last < 66 || video.readyState < 2 || !video.videoWidth) return;
      last = now;
      const bw = banner.clientWidth, bh = banner.clientHeight, gh = glow.clientHeight;
      if (!bw || !bh || !gh) return;
      const w = 48, h = Math.round(w * gh / bw);
      if (glow.width !== w || glow.height !== h) { glow.width = w; glow.height = h; }
      // même cadrage que la bannière (object-fit: cover)…
      const vw = video.videoWidth, vh = video.videoHeight;
      const k = Math.min(vw / bw, vh / bh);
      const sw = bw * k, sh = bh * k, sx = (vw - sw) / 2, sy = (vh - sh) / 2;
      const top = Math.round(h * bh / gh);
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, top);
      // …puis le bas de l'image est étiré vers le bas pour prolonger ses couleurs
      const strip = sh * 0.15;
      ctx.drawImage(video, sx, sy + sh - strip, sw, strip, 0, top, w, h - top);
      glow.classList.add("is-on");
    })(0);
  }

  // Économie batterie/CPU : vidéos en pause quand l'onglet est caché
  document.addEventListener("visibilitychange", () => {
    document.querySelectorAll("video").forEach((v) => {
      if (document.hidden) v.pause();
      else v.play().catch(() => {});
    });
  });

  // Discord
  $("server-name").textContent = CONFIG.discord.serverName;
  $("server-logo").src = CONFIG.discord.logo;
  $("server-join").href = CONFIG.discord.inviteUrl;
  $("online-count").textContent = CONFIG.discord.fallbackOnline.toLocaleString("en-US");
  $("member-count").textContent = CONFIG.discord.fallbackMembers.toLocaleString("en-US");

  async function refreshDiscordStats() {
    if (document.hidden) return; // inutile quand l'onglet est caché
    try {
      const r = await fetch(`https://discord.com/api/v10/invites/${CONFIG.discord.inviteCode}?with_counts=true`, { cache: "no-store" });
      if (!r.ok) return;
      const d = await r.json();
      if (typeof d.approximate_presence_count === "number") $("online-count").textContent = d.approximate_presence_count.toLocaleString("en-US");
      if (typeof d.approximate_member_count === "number") $("member-count").textContent = d.approximate_member_count.toLocaleString("en-US");
    } catch (e) { /* offline : on garde le fallback */ }
  }
  refreshDiscordStats();
  setInterval(refreshDiscordStats, 30000);

  // Réseaux — lien classique (`url`) ou copie presse-papier (`copy`)
  $("socials").innerHTML = CONFIG.socials
    .map((s) => {
      const icon = ICONS[s.type] || ICONS.mail;
      if (s.copy) {
        return `<button class="social social-copy" type="button" data-copy="${s.copy}" aria-label="Copier l'adresse ${s.type}">${icon}</button>`;
      }
      return `<a class="social" href="${s.url}" target="_blank" rel="noopener noreferrer" aria-label="${s.type}">${icon}</a>`;
    })
    .join("");

  // Copie robuste : Clipboard API (HTTPS) sinon repli execCommand ; le retour
  // visuel "copié ✓" n'apparaît que si la copie a réellement réussi
  let allowProgrammaticCopy = false; // laisse passer le repli malgré le blocage "copy" des protections front
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(() => true, () => false);
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    ta.setAttribute("readonly", "");
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    allowProgrammaticCopy = true;
    try { ok = document.execCommand("copy"); } catch (e) {}
    allowProgrammaticCopy = false;
    ta.remove();
    return Promise.resolve(ok);
  }

  document.querySelectorAll(".social-copy").forEach((btn) => {
    let timer;
    btn.addEventListener("click", async () => {
      const ok = await copyText(btn.dataset.copy);
      if (!ok) return;
      btn.classList.add("copied");
      clearTimeout(timer);
      timer = setTimeout(() => btn.classList.remove("copied"), 1500);
    });
  });

  // Compteur de vues (base + compteur local) — animé à l'entrée sur le site
  const viewsTotal = (function initViews() {
    const KEY = "haspii_views";
    let local = 1;
    try {
      local = (parseInt(localStorage.getItem(KEY), 10) || 0) + 1;
      localStorage.setItem(KEY, String(local));
    } catch (e) { /* stockage indisponible (navigation privée) : on compte 1 */ }
    return CONFIG.viewsBase + local;
  })();

  function countViews() {
    const el = $("view-count");
    const start = performance.now(), dur = 1100;
    (function tick(now) {
      const t = Math.min(1, Math.max(0, (now - start) / dur));
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(viewsTotal * eased).toLocaleString("en-US");
      if (t < 1) requestAnimationFrame(tick);
    })(start);
  }

  /* ================================================================
     Intro
     ================================================================ */
  const intro = $("intro");
  /* Chorégraphie d'akio.cash : le flou de l'intro se dissout pendant que la
     carte apparaît en fondu (500 ms) ; 300 ms plus tard, le nom glisse depuis
     la gauche et les réseaux descendent pendant que la carte s'agrandit. */
  function enterSite() {
    if (intro.classList.contains("leaving")) return;
    const body = document.body;
    intro.classList.add("leaving");
    body.classList.add("entered");
    setTimeout(() => body.classList.add("revealed"), 300);
    setTimeout(() => body.classList.add("settled"), 1850); // fin de l'agrandissement
    setTimeout(startTypewriter, 500);
    setTimeout(countViews, 300);
    setTimeout(() => intro.remove(), 600);
  }
  intro.addEventListener("click", enterSite);
  intro.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enterSite(); }
  });

  /* ================================================================
     Typewriter
     ================================================================ */
  function startTypewriter() {
    const el = $("typewriter");
    const phrases = CONFIG.typewriter;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced || phrases.length === 0) { el.textContent = phrases[0] || ""; return; }
    let pi = 0, i = 0, erasing = false;
    (function tick() {
      const text = phrases[pi];
      if (!erasing) {
        i++; el.textContent = text.slice(0, i);
        if (i >= text.length) { erasing = true; setTimeout(tick, 1000); }
        else setTimeout(tick, 120);
      } else {
        i--; el.textContent = text.slice(0, i);
        if (i <= 0) { erasing = false; pi = (pi + 1) % phrases.length; setTimeout(tick, 1000); }
        else setTimeout(tick, 80);
      }
    })();
  }

  /* ================================================================
     Tilt 3D sur la carte (réglages d'akio.cash) : ±7° à l'horizontale,
     moitié moins à la verticale, perspective 1200px, retour à plat quand
     la souris quitte la fenêtre
     ================================================================ */
  (function tilt() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (!matchMedia("(pointer: fine)").matches) return; // pas de tilt au tactile
    const card = $("card");
    const maxTilt = 7;
    const s = { x: 0, y: 0, tx: 0, ty: 0 };
    document.addEventListener("mousemove", (e) => {
      const offsetX = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const offsetY = (e.clientY - innerHeight / 2) / (innerHeight / 2) * 0.5;
      s.ty = offsetX * maxTilt;
      s.tx = -offsetY * maxTilt;
    });
    document.addEventListener("mouseout", (e) => {
      if (!e.relatedTarget) { s.tx = 0; s.ty = 0; }
    });
    (function loop() {
      // suit la souris presque instantanément (akio : transition de 50 ms),
      // avec juste assez de lissage pour gommer les à-coups
      const settled = Math.abs(s.tx - s.x) < 0.002 && Math.abs(s.ty - s.y) < 0.002;
      if (!settled) {
        s.x += (s.tx - s.x) * 0.25;
        s.y += (s.ty - s.y) * 0.25;
        card.style.transform = `perspective(1200px) rotateX(${s.x.toFixed(3)}deg) rotateY(${s.y.toFixed(3)}deg)`;
      }
      requestAnimationFrame(loop);
    })();
  })();

  /* ================================================================
     Curseur : point blanc qui suit la souris
     ================================================================ */
  (function cursorDot() {
    if (!matchMedia("(pointer: fine)").matches) return;
    const dot = $("cursor");
    document.addEventListener("mousemove", (e) => {
      dot.style.transform = `translate(${e.clientX - 4}px, ${e.clientY - 4}px)`;
      dot.classList.add("is-on");
    });
    document.addEventListener("mouseout", (e) => {
      if (!e.relatedTarget) dot.classList.remove("is-on");
    });
  })();

  /* ================================================================
     Sparkles au curseur
     ================================================================ */
  (function sparkles() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (matchMedia("(pointer: coarse)").matches) return;
    let last = 0;
    window.addEventListener("pointermove", (e) => {
      const now = performance.now();
      if (now - last < 50) return;
      last = now;
      const s = document.createElement("span");
      s.className = "spark";
      s.style.left = e.clientX + "px";
      s.style.top = e.clientY + "px";
      s.style.setProperty("--dx", (Math.random() * 24 - 12).toFixed(1) + "px");
      s.style.setProperty("--dy", (Math.random() * 24 + 6).toFixed(1) + "px");
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 750);
    });
  })();

  /* ================================================================
     Protections front (optionnel)
     ================================================================ */
  if (CONFIG.frontProtections) {
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("dragstart", (e) => e.preventDefault());
    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "f12" || (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(k)) || (e.ctrlKey && k === "u")) {
        e.preventDefault();
      }
    });
    document.addEventListener("copy", (e) => { if (!allowProgrammaticCopy) e.preventDefault(); });
  }
  </script>
