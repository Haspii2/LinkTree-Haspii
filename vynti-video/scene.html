<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>VYNTI — motion design</title>
<style>
  :root {
    --ink: #0f0f11; --ink2: #2b2d32; --mu: #6c6f76; --fa: #a2a5ab; --off: #f5f5f6; --live: #22a06b;
    --disp: "Inter Display", "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: var(--off); }
  body { width: 1920px; height: 1080px; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--off); color: var(--ink);
    font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  .tn { font-variant-numeric: tabular-nums; }
  svg.i { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ab { position: absolute; }
  .p3 { transform-style: preserve-3d; }

  /* ---------- thèmes (séquences 6 à 8) ---------- */
  .light { --bg: #f5f5f6; --sf: #fff; --sf2: #f7f7f8; --sf3: #eeeef0; --tx: #0f0f11; --tx2: #2b2d32; --mu: #6c6f76; --fa: #a2a5ab;
    --ln: rgba(15,15,17,.08); --ln2: rgba(15,15,17,.14); --dot: rgba(15,15,17,.10); --hal: rgba(255,255,255,.95); --hal2: rgba(15,15,17,.035);
    --sh: 0 0 0 1px rgba(15,15,17,.06), 0 2px 6px rgba(15,15,17,.04), 0 24px 50px -18px rgba(15,15,17,.18); --band: rgba(245,245,246,.82); --veil: rgba(245,245,246,.7); --veil2: rgba(245,245,246,.42); }
  .dark { --bg: #0f1012; --sf: #18191c; --sf2: #1e1f23; --sf3: #28292e; --tx: #f4f3f1; --tx2: #dcdad6; --mu: #9a9ca3; --fa: #6d7078;
    --ln: rgba(255,255,255,.08); --ln2: rgba(255,255,255,.14); --dot: rgba(255,255,255,.06); --hal: rgba(255,255,255,.035); --hal2: rgba(255,255,255,.02);
    --sh: 0 0 0 1px rgba(255,255,255,.07), 0 24px 50px -18px rgba(0,0,0,.65); --band: rgba(15,16,18,.82); --veil: rgba(15,16,18,.7); --veil2: rgba(15,16,18,.5); }

  .bg { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  .bg .dots { position: absolute; inset: 0; background-image: radial-gradient(circle at 1.5px 1.5px, var(--dot) 1.2px, transparent 1.8px);
    background-size: 36px 36px; -webkit-mask-image: radial-gradient(ellipse 72% 72% at 50% 50%, #000 15%, transparent 100%); }
  .bg .h1, .bg .h2 { position: absolute; left: 0; top: 0; width: 1300px; height: 1300px; border-radius: 50%; }
  .bg .h1 { background: radial-gradient(circle, var(--hal), transparent 62%); }
  .bg .h2 { background: radial-gradient(circle, var(--hal2), transparent 62%); }

  /* ---------- scènes et caméra ---------- */
  .scene { position: absolute; inset: 0; display: none; perspective: 2000px; perspective-origin: 960px 540px; overflow: hidden; }
  .cam { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; transform-style: preserve-3d; }
  .world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }

  /* ---------- annonces (mur, fil) ---------- */
  .lc { position: absolute; left: 0; top: 0; width: 420px; height: 84px; display: flex; align-items: center; gap: 14px; padding: 0 18px 0 14px;
    background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px rgba(15,15,17,.06), 0 10px 24px -14px rgba(15,15,17,.22); transform-origin: 0 0; }
  .lc > :not(.ov):not(.htag) { position: relative; }
  .lc > img { width: 56px; height: 56px; flex: none; display: block; }
  .lc .tx { flex: 1; min-width: 0; }
  .lc .ti { font-size: 15px; font-weight: 500; color: #141416; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.005em; }
  .lc .me { font-size: 12.5px; color: #8b8e94; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lc .pr { flex: none; text-align: right; }
  .lc .pr b { display: block; font-size: 15px; font-weight: 600; color: #141416; }
  .lc .pr span { display: inline-flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 11.5px; color: #a2a5ab; }
  .lc .pr em { font-style: normal; background: #f0f0f2; border-radius: 6px; padding: 1px 7px; color: #55585e; }
  .lc .ov { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .lc .sel { background: #f3f3f4; box-shadow: inset 2px 0 0 #0f0f11; }
  .lc .nw { background: rgba(15,15,17,.045); box-shadow: inset 2px 0 0 #0f0f11; }
  .lc.row { width: 778px; border-radius: 0; box-shadow: none; border-bottom: 1px solid #eeeef0; padding: 0 22px 0 30px; }
  #hero { z-index: 2; }
  .htag { position: absolute; right: 12px; top: -44px; height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 12px; border-radius: 999px;
    background: #0f0f11; color: #fff; font-size: 13.5px; font-weight: 600; white-space: nowrap; box-shadow: 0 12px 24px -10px rgba(15,15,17,.5); transform-origin: 85% 100%; }
  .htag span { color: rgba(255,255,255,.6); font-weight: 500; }
  .ldot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; position: relative; }
  .ldot i { position: absolute; left: -4px; top: -4px; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--live); opacity: 0; }

  /* ---------- fenêtre VYNTI (vectorielle) ---------- */
  #win { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-style: preserve-3d; }
  #wbase { position: absolute; background: #fff; border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(15,15,17,.07), 0 30px 60px -20px rgba(15,15,17,.16), 0 90px 160px -40px rgba(15,15,17,.20); }
  #wclip { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-style: preserve-3d; }
  .side { position: absolute; left: 0; top: 0; width: 232px; height: 866px; background: #fafafb; border-right: 1px solid #ededf0; border-radius: 16px 0 0 0; }
  .sbs { position: absolute; left: 20px; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; color: #a2a5ab; }
  .sbi { position: absolute; left: 10px; width: 212px; height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 13.5px; color: #3a3c41; border-radius: 8px; }
  .sbi svg { color: #6c6f76; }
  #sAct { position: absolute; left: 10px; top: 0; width: 212px; height: 30px; border-radius: 8px; background: #ececee; }
  #sHov { position: absolute; left: 10px; top: 0; width: 212px; height: 30px; border-radius: 8px; background: #f1f1f3; opacity: 0; }
  .page { position: absolute; left: 232px; top: 0; width: 1208px; height: 866px; transform-style: preserve-3d; }
  .hdr { position: absolute; left: 0; top: 0; width: 1208px; height: 100px; background: #fff; border-bottom: 1px solid #ededf0; border-radius: 0 16px 0 0; }
  .ctl { position: absolute; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #e5e5e8; border-radius: 9px;
    font-size: 12.5px; color: #3a3c41; background: #fff; white-space: nowrap; }
  .ctl .m { color: #8b8e94; }
  .ctl b { font-weight: 600; color: #141416; }
  .kbd { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; border: 1px solid #e2e2e6; border-radius: 4px; font-size: 10px; color: #55585e; background: #fff; }
  .tabx { position: absolute; top: 66px; font-size: 13.5px; color: #55585e; display: flex; gap: 7px; align-items: baseline; }
  .tabx em { font-style: normal; font-size: 11.5px; color: #a2a5ab; }
  .status { position: absolute; left: 0; top: 866px; width: 1440px; height: 34px; border-top: 1px solid #ededf0; background: #fafafb; border-radius: 0 0 16px 16px;
    display: flex; align-items: center; gap: 26px; padding: 0 20px; font-size: 11.5px; color: #8b8e94; }
  .status b { font-weight: 600; color: #3a3c41; }
  #panel { position: absolute; left: 778px; top: 100px; width: 430px; height: 766px; background: #fff; border-left: 1px solid #ededf0; transform-style: preserve-3d; }
  #pCard { position: absolute; left: 17px; top: 404px; width: 396px; background: #fafafb; border: 1px solid #e8e8eb; border-radius: 11px; padding: 13px 16px 12px; transform-origin: 50% 50%; }
  .pc-h { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: .07em; color: #8b8e94; margin-bottom: 4px; }
  .pc-h span:last-child { font-weight: 400; letter-spacing: 0; }
  .pc-l { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; color: #2b2d32; }
  .pc-l b { font-weight: 500; }
  .pc-t { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #e8e8eb; margin-top: 5px; padding-top: 9px; }
  .pc-t span { font-size: 13px; font-weight: 600; }
  .pc-t b { font-family: var(--disp); font-size: 24px; font-weight: 700; color: #0f0f11; letter-spacing: -.02em; }
  #wveil { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border-radius: 16px; background: #f5f5f6; opacity: 0; }

  /* écran Filtres (dans la fenêtre) */
  .btn { position: absolute; height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 13px; border: 1px solid #e3e3e7; border-radius: 9px;
    font-size: 13px; font-weight: 500; background: #fff; color: #18181a; white-space: nowrap; }
  .btn.dk { background: #0f0f11; color: #fff; border-color: #0f0f11; font-weight: 600; }
  .tab { position: absolute; top: 70px; height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-radius: 7px; font-size: 13px; color: #3a3c41; }
  .tab em { font-style: normal; color: #9a9da3; font-size: 11.5px; }
  .tg { position: absolute; width: 30px; height: 17px; border-radius: 9px; background: #d9dadd; }
  .tg i { position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .tg.big { width: 50px; height: 28px; border-radius: 14px; flex: none; }
  .tg.big i { left: 3px; top: 3px; width: 22px; height: 22px; }
  .ch { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 500; border: 1px solid #e3e3e7;
    background: #fff; color: #2b2d32; white-space: nowrap; }
  .ch i { width: 5px; height: 5px; border-radius: 50%; background: #a2a5ab; flex: none; }

  /* maquette Filtres (deuxième fenêtre) */
  #FM { position: absolute; left: 150px; top: 168px; width: 1140px; background: #fff; border-radius: 20px; overflow: hidden; transform-origin: 50% 0;
    box-shadow: 0 0 0 1px rgba(15,15,17,.07), 0 2px 6px rgba(15,15,17,.04), 0 40px 80px -24px rgba(15,15,17,.28), 0 90px 180px -50px rgba(15,15,17,.25); }
  #FM .top { position: absolute; left: 0; top: 0; width: 1140px; height: 84px; border-bottom: 1px solid #ededf0; }
  #FM .th { position: absolute; left: 0; top: 84px; width: 1140px; height: 48px; background: #f7f7f8; border-bottom: 1px solid #ededf0;
    font-size: 12.5px; font-weight: 600; letter-spacing: .08em; color: #a2a5ab; }
  #FM .th span { position: absolute; top: 17px; }
  .fr { position: absolute; left: 0; width: 1140px; height: 104px; border-bottom: 1px solid #ededf0; background: #fff; }
  .fr .nm { position: absolute; left: 124px; top: 26px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .fr .sb { position: absolute; left: 124px; top: 58px; font-size: 14px; color: #8b8e94; white-space: nowrap; }
  .fr .crit { position: absolute; left: 470px; top: 36px; display: flex; gap: 7px; }
  .fr .ch { height: 32px; padding: 0 11px; font-size: 14px; border-radius: 8px; gap: 7px; }
  .fr .ch i { width: 6px; height: 6px; }
  .fr .tg.big { position: absolute; left: 30px; top: 38px; }
  .fr .pz { position: absolute; right: 150px; top: 36px; font-size: 22px; font-weight: 600; text-align: right; }
  .fr .ls { position: absolute; right: 30px; top: 40px; font-size: 16px; color: #8b8e94; text-align: right; }
  #fmPill { position: absolute; left: 140px; top: 26px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 12px; border-radius: 999px;
    font-size: 14px; font-weight: 600; background: #f1f1f3; color: #6c6f76; white-space: nowrap; transform-origin: 0 50%; }
  #fmPill i { width: 7px; height: 7px; border-radius: 50%; background: #b9bcc2; }
  #fmUrl { position: absolute; left: 520px; top: 21px; width: 420px; height: 42px; border: 1px solid #dcdde0; border-radius: 10px; display: flex; align-items: center;
    gap: 9px; padding: 0 12px; color: #a2a5ab; font-size: 14px; background: #fff; }
  #urlTx { position: relative; font-size: 13.5px; color: #141416; white-space: nowrap; }
  .tok { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .tok .ch { position: absolute; left: 0; top: 0; }
  .tok .tt { position: absolute; left: 0; top: 0; font-size: 13.5px; line-height: 22px; color: #0f0f11; background: rgba(15,15,17,.08); border-radius: 4px; padding: 0 2px; }
  .caret { display: inline-block; width: 2px; height: 1.05em; background: currentColor; vertical-align: -.15em; margin-left: 1px; }

  /* toasts */
  .toast { position: absolute; left: 0; top: 0; width: 430px; padding: 13px 18px 13px 13px; display: flex; gap: 14px; align-items: center;
    background: #fff; border-radius: 16px; box-shadow: 0 0 0 1px rgba(15,15,17,.07), 0 22px 44px -14px rgba(15,15,17,.26); }
  .toast img { width: 56px; height: 56px; flex: none; display: block; }
  .toast .tx { flex: 1; min-width: 0; }
  .toast .lb { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #8b8e94; }
  .toast .lb span { margin-left: auto; color: #a2a5ab; font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 13px; }
  .toast .ti { font-size: 18px; font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; color: #0f0f11; }
  .toast .me { display: flex; justify-content: space-between; font-size: 15px; color: #6c6f76; margin-top: 2px; }
  .toast .me b { color: #0f0f11; font-weight: 600; }

  /* galerie de pages (fond dynamique) */
  .gp { position: absolute; border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 1px rgba(15,15,17,.07), 0 30px 70px -20px rgba(15,15,17,.25); }
  .gp img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }

  /* carte Sécurité / canevas */
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .card { background: #fff; border-radius: 22px; box-shadow: 0 0 0 1px rgba(15,15,17,.06), 0 2px 6px rgba(15,15,17,.04), 0 30px 60px -18px rgba(15,15,17,.18), 0 80px 160px -40px rgba(15,15,17,.2); }
  .krow { position: absolute; left: 28px; width: 804px; height: 84px; display: flex; align-items: center; gap: 18px; padding: 0 22px;
    border-radius: 16px; border: 1px solid rgba(15,15,17,.08); background: #fbfbfc; }
  .krow .ic, .khead .ic { width: 50px; height: 50px; border-radius: 13px; background: #fff; border: 1px solid rgba(15,15,17,.08); display: grid; place-items: center; color: #2b2d32; flex: none; }
  .krow .tx { flex: 1; }
  .krow .tx b { display: block; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .krow .tx span { display: block; font-size: 15px; color: #6c6f76; margin-top: 4px; }
  .inp { width: 160px; height: 48px; border-radius: 12px; border: 1px solid #dcdde0; background: #fff; display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; font-size: 20px; font-weight: 600; }
  .inp em { font-style: normal; color: #a2a5ab; font-weight: 500; }
  .canvasbg { position: absolute; inset: 0; border-radius: 22px; background-color: #fbfbfc;
    background-image: radial-gradient(circle at 1px 1px, rgba(15,15,17,.13) 1px, transparent 1.5px); background-size: 22px 22px;
    box-shadow: 0 0 0 1px rgba(15,15,17,.07), 0 30px 60px -18px rgba(15,15,17,.18); }
  .blk { position: absolute; background: #fff; border-radius: 16px; box-shadow: 0 0 0 1px rgba(15,15,17,.08), 0 12px 28px -14px rgba(15,15,17,.25); padding: 14px 18px; }
  .blk .k { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; color: #a2a5ab; }
  .blk .r { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .blk .r b { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .blk .ib { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; background: #f1f1f3; color: #2b2d32; }
  .gpill { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }

  /* conversation */
  .msg { position: absolute; }
  .msg .who { font-size: 13px; font-weight: 600; color: #a2a5ab; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .bub { padding: 13px 17px; border-radius: 18px; font-size: 18px; line-height: 1.42; }
  .me .who { justify-content: flex-end; }
  .me .bub { background: #0f0f11; color: #fff; border-bottom-right-radius: 6px; }
  .them .bub { background: #efeff1; color: #0f0f11; border-bottom-left-radius: 6px; }

  /* tableau de bord + grille */
  .droot { position: absolute; inset: 0; display: none; perspective: 2000px; perspective-origin: 960px 540px; overflow: hidden; color: var(--tx); }
  .gwall { position: absolute; inset: 0; perspective: 3200px; perspective-origin: 960px 540px; overflow: hidden; }
  .gwall .wl { position: absolute; left: 50%; top: 50%; width: 3060px; height: 2000px; margin: -1000px 0 0 -1530px; }
  .gwall .wc { position: absolute; top: 0; width: 576px; }
  .gwall .wt { width: 576px; height: 360px; margin-bottom: 36px; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px rgba(15,15,17,.07), 0 24px 50px -16px rgba(15,15,17,.22); }
  .gwall .wt img { width: 100%; display: block; }
  .dark .gwall .wt { filter: invert(.9) hue-rotate(180deg) saturate(.6); }
  .gwall .gv { position: absolute; inset: 0; background: radial-gradient(ellipse 58% 52% at 50% 50%, var(--veil) 0%, transparent 100%), linear-gradient(var(--veil2), var(--veil2)); }
  .surf { background: var(--sf); border-radius: 18px; box-shadow: var(--sh); }
  .tile { position: absolute; top: 0; width: 266px; height: 150px; padding: 20px 22px; }
  .tile .lb { font-size: 16px; color: var(--mu); font-weight: 500; }
  .tile .v { font-family: var(--disp); font-size: 42px; font-weight: 600; letter-spacing: -.03em; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .tile .sb { font-size: 13px; color: var(--fa); margin-top: 4px; }
  .cell { position: absolute; overflow: hidden; padding: 24px 26px; }
  .cell h5 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .cell .fp { position: absolute; right: 18px; top: 18px; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px;
    background: var(--sf3); color: var(--tx2); font-size: 14px; font-weight: 600; }
  .cell .lit { position: absolute; inset: 0; border-radius: 18px; box-shadow: inset 0 0 0 1.5px var(--tx); opacity: 0; }
  .crow { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--ln); position: relative; }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 600; color: #fff; flex: none; }
  .band { position: absolute; left: 0; top: 402px; width: 1920px; height: 276px; background: var(--band);
    -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); opacity: 0; }
  .dt { position: absolute; left: 0; top: 436px; width: 1920px; text-align: center; font-family: var(--disp); font-weight: 600; font-size: 84px;
    line-height: 1.05; letter-spacing: -.03em; color: var(--tx); }
  .dt .g { color: var(--fa); }
  .sheen { position: absolute; left: 0; top: -400px; width: 700px; height: 1900px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
    transform-origin: 0 0; opacity: 0; }

  /* textes */
  #copy { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  .cp { position: absolute; visibility: hidden; }
  .ln { display: block; overflow: hidden; padding: 0 .06em .14em; margin: 0 -.06em -.14em; }
  .li { display: block; }
  .lbl { left: 96px; top: 80px; display: inline-flex; align-items: center; gap: 12px; height: 42px; padding: 0 20px 0 16px; border-radius: 999px;
    background: #0f0f11; box-shadow: 0 12px 26px -12px rgba(15,15,17,.55); font-size: 16.5px; font-weight: 500; color: #fff; letter-spacing: .005em; }
  .lbl .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }

const T1 = 2.35, T2 = 3.25;                  // freinage du mur
function gScroll(t) {
  // position « temps équivalent » : avance à vitesse 1, freine (vitesse continue), puis reprend doucement en fond
  if (t < T1) return t + 1.2;
  if (t < T2) return T1 + 1.2 + (T2 - T1) / 3 * E.outCubic((t - T1) / (T2 - T1));
  const base = T1 + 1.2 + (T2 - T1) / 3;
  const r = t - 6.2; return base + (r > 0 ? .1 * (r < 1.5 ? r * r / 3 : r - .75) : 0);
}

const GLIDE = [21.2, 23.25];
function camW(t) {
  if (t >= GLIDE[0] && t < GLIDE[1]) {
    // glissé d'une page à l'autre : départ doux, longue arrivée, recul au milieu du trajet
    const u = (t - GLIDE[0]) / (GLIDE[1] - GLIDE[0]);
    const c = mixCam(WCAM(GLIDE[0]), WCAM(GLIDE[1]), C.glide(u));
    c.s *= Math.exp(Math.log(.62) * Math.pow(Math.sin(Math.PI * u * (1.25 - .25 * u)), 2));

    return mixCam(a, b, C.whipIn(clamp((t - 40.0) / .4)));

}

function buildCopy() {
  R.copy = COPY.map(([kind, html, tin, tout, style]) => {
    const el = document.createElement('div'); el.className = 'cp ' + kind;
    if (style) el.style.cssText = style;
    if (kind === 'lbl') { const [n, l] = html.split('|'); el.innerHTML = `<span class="dot"></span><span class="num">${n}</span><span class="sep"></span>${l}`; }
    else el.innerHTML = html;
    $('#copy').appendChild(el);
    return { el, kind, tin, tout, lines: kind === 'lbl' ? null : prepLines(el) };
  });
}
function renderCopy(t) {
  for (const c of R.copy) {
    if (c.kind === 'lbl') {
      if (t < c.tin || t > c.tout + .4) { c.el.style.visibility = 'hidden'; continue; }
      c.el.style.visibility = 'visible';
      const p = P(t, c.tin, .6, C.iso), q = P(t, c.tout, .35, C.textOut);
      c.el.style.clipPath = `inset(-20px ${100 * (1 - p)}% -20px -20px round 999px)`;
      c.el.style.transform = `translate3d(${-14 * (1 - p)}px,${-10 * q}px,0)`;
      c.el.style.opacity = 1 - q;
    } else lineText(c.el, c.lines, t, c.tin, c.tout);
  }
  // voile de lisibilité derrière les titres (bas gauche) et au centre (accroche)
  const ttlOn = R.copy.filter(c => c.kind === 'ttl').map(c => P(t, c.tin - .2, .5) * (1 - P(t, c.tout + .2, .5))).reduce((a, b) => Math.max(a, b), 0);
  $('#scrim').style.opacity = t < 40.4 ? ttlOn : 0;
  $('#haze').style.opacity = P(t, .3, .6) * (1 - P(t, 4.95, .5));
  $('#haze').style.transform = `translateY(${lerp(0, 230, P(t, 2.6, 1.0, C.push))}px)`;
}

/* =============================== CURSEUR =============================== */
const rectPt = (el, fx = .5, fy = .5) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * fx, y: r.top + r.height * fy }; };
function arcPt(a, b, p, lift = 120, side = 1) {
  const mx = (a.x + b.x) / 2 + side * lift * .6, my = (a.y + b.y) / 2 - lift;
  const u = 1 - p; return { x: u * u * a.x + 2 * u * p * mx + p * p * b.x, y: u * u * a.y + 2 * u * p * my + p * p * b.y };
}
/* trajet du curseur : segments (début, fin, cible) — positions relues à l'écran à chaque image */
function cursorAt(t) {
  if (t >= 13.65 && t < 21.0) {
    const pc = () => rectPt($('#pCard'), .82, .9);
    const fil = () => rectPt($('#sb-fil'), .3, .55);
    const url = () => rectPt($('#fmUrl'), .14, .6);
    const tA = () => rectPt($('#ftgA'), .5, .55), tB = () => rectPt($('#ftgB'), .5, .55);
    let pos, o = 1;
    if (t < 13.8) { pos = pc(); o = P(t, 13.65, .15); }
    else if (t < 14.68) pos = arcPt(pc(), fil(), C.push(clamp((t - 13.8) / .85)), 90, -1);
    else if (t < 16.2) pos = fil();
    else if (t < 16.78) pos = arcPt(fil(), url(), C.push(clamp((t - 16.2) / .58)), 80, 1);
    else if (t < 18.3) pos = url();
    else if (t < 18.9) pos = arcPt(url(), tA(), C.push(clamp((t - 18.3) / .6)), 60, -1);
    else if (t < 19.38) pos = tA();
    else if (t < 19.88) pos = arcPt(tA(), tB(), C.push(clamp((t - 19.38) / .5)), 30, 1);
    else if (t < 20.3) pos = tB();
    else { const p = C.push(clamp((t - 20.3) / .6)); const b = tB(); pos = { x: b.x + 260 * p, y: b.y + 300 * p }; o = 1 - P(t, 20.45, .4); }
    const clicks = [14.68, 16.8, 18.95, 19.95];
    return { pos, o, clicks };
  }
  if (t >= 35.55 && t < 36.9) {
    const r = $('#dOk').getBoundingClientRect();
    const tx = r.left + r.width * .55, ty = r.top + r.height * .6;
    const p = C.push(clamp((t - 35.6) / .7));
    const sx = 1700, sy = 1120, mx = (sx + tx) / 2 + 160, my = Math.min(sy, ty) - 120;
    const u = 1 - p;
    return { pos: { x: u * u * sx + 2 * u * p * mx + p * p * tx, y: u * u * sy + 2 * u * p * my + p * p * ty },
      o: clamp((t - 35.55) / .15) * (1 - P(t, 36.6, .3)), clicks: [36.3] };
  }
  return null;
}
function renderCursor(t) {
  const c = $('#cursor'), rp = $('#ripple');
  const st = cursorAt(t);
  if (!st) { c.style.opacity = 0; rp.style.opacity = 0; return; }
  const { pos, o, clicks } = st;
  const ck = clicks.map(a => t - a).find(d => d > -.02 && d < .6);
  const press = ck !== undefined && ck < .14 ? 1 - .12 * Math.sin(Math.PI * clamp(ck / .14)) : 1;
  c.style.transform = `translate3d(${pos.x - 5}px,${pos.y - 3}px,0)`;
  c.firstElementChild.style.transform = `scale(${press})`;
  c.style.opacity = o;
  if (ck !== undefined && ck >= 0) {
    const rr = clamp(ck / .5);
    rp.style.transform = `translate3d(${pos.x}px,${pos.y}px,0) scale(${lerp(.3, 1.4, E.outCubic(rr))})`;
    rp.style.opacity = rr < 1 ? (1 - rr) * .9 * o : 0;
  } else rp.style.opacity = 0;
}

}

function renderFrame(t) {

}
