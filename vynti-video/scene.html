<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>VYNTI — motion design</title>
<style>
  :root {
    --ink: #111112; --ink2: #2a2c31; --mu: #6b6f76; --fa: #a1a4ab;
    --gr: #16835a; --bl: #545ecb; --off: #f8f8f9;
    --disp: "Inter Display", "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: var(--off); }
  body { width: 1920px; height: 1080px; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--off); color: var(--ink);
    font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  .tn { font-variant-numeric: tabular-nums; }
  svg.i { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ab { position: absolute; }
  .p3 { transform-style: preserve-3d; }

  /* ---------- thèmes ---------- */
  .light { --bg: #f8f8f9; --sf: #fff; --sf2: #f6f6f7; --sf3: #efeff1; --tx: #111112; --tx2: #2a2c31; --mu: #6b6f76; --fa: #a1a4ab;
    --ln: rgba(17,17,18,.08); --ln2: rgba(17,17,18,.14); --gr: #16835a; --grs: rgba(22,131,90,.10); --bl: #545ecb; --bls: rgba(84,94,203,.10);
    --dot: rgba(17,17,18,.12); --btn: #111112; --btntx: #fff; --hg: rgba(22,131,90,.10); --hb: rgba(84,94,203,.075);
    --sh: 0 0 0 1px rgba(17,17,18,.06), 0 2px 6px rgba(17,17,18,.04), 0 24px 50px -18px rgba(17,17,18,.20); --band: rgba(248,248,249,.80); --tgoff: #d9dadd; }
  .dark { --bg: #111214; --sf: #1a1b1e; --sf2: #202125; --sf3: #2a2b30; --tx: #f5f4f2; --tx2: #dcdad6; --mu: #9b9da4; --fa: #6f727a;
    --ln: rgba(255,255,255,.08); --ln2: rgba(255,255,255,.14); --gr: #28a06f; --grs: rgba(40,160,111,.18); --bl: #747ee0; --bls: rgba(116,126,224,.18);
    --dot: rgba(255,255,255,.07); --btn: #f5f4f2; --btntx: #111112; --hg: rgba(40,160,111,.15); --hb: rgba(116,126,224,.12);
    --sh: 0 0 0 1px rgba(255,255,255,.07), 0 24px 50px -18px rgba(0,0,0,.65); --band: rgba(17,18,20,.80); --tgoff: #3a3b40; }

  .bg { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  .bg .dots { position: absolute; inset: 0; background-image: radial-gradient(circle at 1.5px 1.5px, var(--dot) 1.25px, transparent 1.9px);
    background-size: 36px 36px; -webkit-mask-image: radial-gradient(ellipse 72% 72% at 50% 50%, #000 15%, transparent 100%); }
  .bg .h1, .bg .h2 { position: absolute; left: 0; top: 0; width: 1300px; height: 1300px; border-radius: 50%; }
  .bg .h1 { background: radial-gradient(circle, var(--hg), transparent 62%); }
  .bg .h2 { background: radial-gradient(circle, var(--hb), transparent 62%); }

  /* ---------- scènes et caméra ---------- */
  .scene { position: absolute; inset: 0; display: none; perspective: 2000px; perspective-origin: 960px 540px; overflow: hidden; }
  .cam { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; transform-style: preserve-3d; }

  /* fenêtre (capture) */
  .win3 { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-style: preserve-3d; }
  .wframe { position: absolute; inset: 0; border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(17,17,18,.07), 0 24px 48px -12px rgba(17,17,18,.16), 0 70px 140px -30px rgba(17,17,18,.22); }
  .shot { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border-radius: 14px; }

  /* rangées du Fil d'actualité */
  .frow { position: absolute; left: 0; width: 778px; height: 68px; background: #fff; border-bottom: 1px solid #ededf0;
    display: flex; align-items: center; gap: 12px; padding: 0 22px 0 31px; }
  .frow > :not(.sel):not(.hlg) { position: relative; }
  .frow .sel { position: absolute; inset: 0; background: #f2f2f3; border-left: 2px solid #111112; opacity: 0; }
  .frow .hlg { position: absolute; inset: 0; background: rgba(22,131,90,.065); border-left: 3px solid #16835a; opacity: 0; }
  .frow img { width: 48px; height: 48px; border-radius: 7px; object-fit: cover; flex: none; }
  .frow .tx { flex: 1; min-width: 0; }
  .frow .ti { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #18181a; }
  .frow .me { font-size: 11.5px; color: #8b8e94; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .pr { text-align: right; flex: none; }
  .frow .pr b { display: block; font-size: 13px; font-weight: 600; }
  .frow .pr span { display: inline-flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 11px; color: #8b8e94; }
  .frow .pr em { font-style: normal; background: #f0f0f2; border-radius: 6px; padding: 1px 7px; color: #55585e; }

  /* panneau de l'annonce */
  #panelA { background: #fff; }
  #pCard { background: #fafafb; border: 1px solid #e7e7ea; border-radius: 10px; padding: 12px 15px 12px; transform-origin: 50% 50%; }
  .pc-h { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: .06em; color: #8b8e94; margin-bottom: 4px; }
  .pc-h span:last-child { font-weight: 400; letter-spacing: 0; }
  .pc-l { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 0; color: #2a2c31; }
  .pc-l b { font-weight: 500; }
  .pc-t { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #e7e7ea; margin-top: 4px; padding-top: 8px; }
  .pc-t span { font-size: 12.5px; font-weight: 600; }
  .pc-t b { font-family: var(--disp); font-size: 22px; font-weight: 700; color: #16835a; letter-spacing: -.02em; }
  .kbd { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border: 1px solid #e2e2e6; border-radius: 4px; font-size: 9.5px; color: #55585e; background: #fff; }
  .ringA { position: absolute; inset: -1px; border-radius: 9px; border: 2px solid #16835a; opacity: 0; }

  /* toasts */
  .toast { position: absolute; left: 0; top: 0; width: 430px; padding: 13px 18px 13px 13px; display: flex; gap: 14px; align-items: center;
    background: #fff; border-radius: 16px; box-shadow: 0 0 0 1px rgba(17,17,18,.07), 0 18px 40px -12px rgba(17,17,18,.24); }
  .toast img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; }
  .toast .tx { flex: 1; min-width: 0; }
  .toast .lb { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--gr); }
  .toast .lb i { width: 7px; height: 7px; border-radius: 50%; background: var(--gr); box-shadow: 0 0 0 4px rgba(22,131,90,.15); }
  .toast .lb span { margin-left: auto; color: var(--fa); font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 14px; }
  .toast .ti { font-size: 18px; font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
  .toast .me { display: flex; justify-content: space-between; font-size: 15px; color: var(--mu); margin-top: 2px; }
  .toast .me b { color: var(--ink); font-weight: 600; }

  /* écran Filtres */
  #fmain { background: #fff; font-size: 13px; }
  .btn { position: absolute; height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 13px; border: 1px solid #e3e3e7; border-radius: 8px;
    font-size: 13px; font-weight: 500; background: #fff; color: #18181a; white-space: nowrap; }
  .btn.dk { background: #111112; color: #fff; border-color: #111112; font-weight: 600; }
  .tab { position: absolute; top: 70px; height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-radius: 7px; font-size: 13px; color: #3a3c41; }
  .tab em { font-style: normal; color: #9a9da3; font-size: 11.5px; }
  .tg { position: absolute; width: 30px; height: 17px; border-radius: 9px; background: var(--tgoff, #d9dadd); }
  .tg i { position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .tg.big { width: 50px; height: 28px; border-radius: 14px; flex: none; }
  .tg.big i { left: 3px; top: 3px; width: 22px; height: 22px; }
  .ch { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 500; border: 1px solid; white-space: nowrap; }
  .ch.b { background: #e6effc; border-color: #bacfef; color: #1f5fbf; }
  .ch.p { background: #efeafc; border-color: #d1c6f0; color: #6746c4; }
  .ch.g { background: #e3f5ec; border-color: #b4dacb; color: #0e7a50; }
  .ch.r { background: #fce8e8; border-color: #f2c4c3; color: #b8322f; }
  .tok { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .tok .ch { position: absolute; left: 0; top: 0; }
  .tok .tt { position: absolute; left: 0; top: 0; font-size: 12px; line-height: 22px; color: #545ecb; background: rgba(84,94,203,.12); border-radius: 4px; padding: 0 2px; }

  /* carte Sécurité / canevas */
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .card { background: #fff; border-radius: 22px; box-shadow: 0 0 0 1px rgba(17,17,18,.06), 0 2px 6px rgba(17,17,18,.04), 0 30px 60px -18px rgba(17,17,18,.18), 0 80px 160px -40px rgba(17,17,18,.2); }
  .krow { position: absolute; left: 28px; width: 804px; height: 84px; display: flex; align-items: center; gap: 18px; padding: 0 22px;
    border-radius: 16px; border: 1px solid rgba(17,17,18,.08); background: #fbfbfc; }
  .krow .ic, .khead .ic { width: 50px; height: 50px; border-radius: 13px; background: #fff; border: 1px solid rgba(17,17,18,.08); display: grid; place-items: center; color: #2a2c31; flex: none; }
  .krow .tx { flex: 1; }
  .krow .tx b { display: block; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .krow .tx span { display: block; font-size: 15px; color: #6b6f76; margin-top: 4px; }
  .inp { width: 160px; height: 48px; border-radius: 12px; border: 1px solid #dcdde0; background: #fff; display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; font-size: 20px; font-weight: 600; }
  .inp em { font-style: normal; color: #a1a4ab; font-weight: 500; }
  .caret { display: inline-block; width: 2px; height: 1.05em; background: currentColor; vertical-align: -.15em; margin-left: 1px; }
  .canvasbg { position: absolute; inset: 0; border-radius: 22px; background-color: #fbfbfc;
    background-image: radial-gradient(circle at 1px 1px, rgba(17,17,18,.14) 1px, transparent 1.5px); background-size: 22px 22px;
    box-shadow: 0 0 0 1px rgba(17,17,18,.07), 0 30px 60px -18px rgba(17,17,18,.18); }
  .blk { position: absolute; background: #fff; border-radius: 16px; box-shadow: 0 0 0 1px rgba(17,17,18,.08), 0 12px 28px -14px rgba(17,17,18,.25); padding: 14px 18px; }
  .blk .k { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; color: #a1a4ab; }
  .blk .r { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .blk .r b { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .blk .ib { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .gpill { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }

  /* conversation */
  .msg { position: absolute; }
  .msg .who { font-size: 13px; font-weight: 600; color: #a1a4ab; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .bub { padding: 13px 17px; border-radius: 18px; font-size: 18px; line-height: 1.42; }
  .me .who { justify-content: flex-end; }
  .me .bub { background: #111112; color: #fff; border-bottom-right-radius: 6px; }
  .them .bub { background: #eef0f2; color: #111112; border-bottom-left-radius: 6px; }

  /* tableau de bord + grille */
  .droot { position: absolute; inset: 0; display: none; perspective: 2000px; perspective-origin: 960px 540px; overflow: hidden; color: var(--tx); }
  .surf { background: var(--sf); border-radius: 18px; box-shadow: var(--sh); }
  .tile { position: absolute; top: 0; width: 266px; height: 150px; padding: 20px 22px; }
  .tile .lb { font-size: 16px; color: var(--mu); font-weight: 500; }
  .tile .v { font-family: var(--disp); font-size: 42px; font-weight: 600; letter-spacing: -.03em; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .tile .sb { font-size: 13px; color: var(--fa); margin-top: 4px; }
  .cell { position: absolute; overflow: hidden; padding: 24px 26px; }
  .cell h5 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .cell .fp { position: absolute; right: 18px; top: 18px; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px;
    background: var(--grs); color: var(--gr); font-size: 14px; font-weight: 600; }
  .cell .fp i { width: 7px; height: 7px; border-radius: 50%; background: var(--gr); }
  .cell .lit { position: absolute; inset: 0; border-radius: 18px; box-shadow: inset 0 0 0 2px var(--gr); opacity: 0; }
  .crow { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--ln); position: relative; }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 600; color: #fff; flex: none; }
  .band { position: absolute; left: 0; top: 402px; width: 1920px; height: 276px; background: var(--band); backdrop-filter: blur(5px);
    -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); opacity: 0; }
  .dt { position: absolute; left: 0; top: 436px; width: 1920px; text-align: center; font-family: var(--disp); font-weight: 600; font-size: 84px;
    line-height: 1.05; letter-spacing: -.025em; color: var(--tx); opacity: 0; }
  .dt .g { color: var(--fa); }
  .sheen { position: absolute; left: 0; top: -400px; width: 700px; height: 1900px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
    transform-origin: 0 0; opacity: 0; }

  /* textes */
  #copy { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  .cp { position: absolute; opacity: 0; }
  .wd { display: inline-block; }
  .pill { left: 96px; top: 80px; display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 18px 0 14px; border-radius: 999px;
    background: #fff; border: 1px solid rgba(17,17,18,.08); box-shadow: 0 1px 2px rgba(17,17,18,.04), 0 6px 16px -6px rgba(17,17,18,.10);
    font-size: 17px; font-weight: 500; color: var(--ink2); transform-origin: 0 50%; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gr); box-shadow: 0 0 0 4px rgba(22,131,90,.14); }
  .pill .num { color: var(--fa); font-variant-numeric: tabular-nums; }
  .pill .sep { width: 1px; height: 16px; background: rgba(17,17,18,.1); }
  .ttl { left: 96px; bottom: 170px; font-family: var(--disp); font-weight: 600; font-size: 80px; line-height: 1.05; letter-spacing: -.025em; white-space: nowrap; }
  .sub { left: 98px; top: 932px; font-size: 24px; color: #6b6f76; white-space: nowrap; }
  .ctr { left: 0; top: 724px; width: 1920px; text-align: center; font-family: var(--disp); font-weight: 600; font-size: 76px; line-height: 1.05; letter-spacing: -.025em; }
  .g { color: #a1a4ab; } .hl { color: var(--gr); } .blu { color: var(--bl); }

  /* curseur */
  #cursor { position: absolute; left: 0; top: 0; z-index: 50; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,.22)); }
  #cursor svg { display: block; transform-origin: 5px 3px; }
  #ripple { position: absolute; left: 0; top: 0; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 2.5px solid var(--bl); opacity: 0; z-index: 49; }

  /* logo */
  .mark polygon { transform-box: fill-box; transform-origin: 50% 50%; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg light" id="bgL"><div class="h1"></div><div class="h2"></div><div class="dots"></div></div>
  <div class="scene" id="A"></div>
  <div class="scene" id="B"></div>
  <div class="scene" id="C"></div>
  <div class="scene" id="D" style="perspective:none"></div>
  <div class="scene dark" id="E"></div>
  <div id="veil" class="ab" style="left:0;top:0;width:1920px;height:1080px;opacity:0;pointer-events:none;z-index:20;
    background:linear-gradient(90deg, transparent, rgba(84,94,203,.10) 40%, rgba(84,94,203,.10) 60%, transparent);"></div>
  <div id="copy"></div>
  <div id="ripple"></div>
  <div id="cursor"><svg width="36" height="42" viewBox="0 0 36 42"><path d="M5 3 L5 32 L12.2 25.3 L17 36 L22 33.8 L17.3 23.4 L27 23.4 Z" fill="#111112" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
</div>

<script>
/* =====================================================================
   VYNTI — moteur d'animation déterministe.
   renderFrame(t) fixe l'état exact de chaque élément à l'instant t.
   Durées, courbes et minutage suivent « Script motion design VYNTI ».
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;

function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-7 || Math.abs(d) < 1e-7) break; t -= e / d; }
    if (Math.abs(sx(t) - x) > 1e-5 || t < 0 || t > 1) { let lo = 0, hi = 1; t = x; for (let i = 0; i < 40; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; } }
    return sy(t);
  };
}
/* vocabulaire de mouvement du script */
const C = {
  win: bez(.16, 1, .3, 1),      // entrée de fenêtre, compteur, fin de fouetté
  push: bez(.65, 0, .35, 1),    // avancée de caméra, tracé, révélation
  focus: bez(.33, 1, .68, 1),   // mise au point
  iso: bez(.22, 1, .36, 1),     // isolation d'un encart, texte
  whipIn: bez(.7, 0, .84, 0),   // début de fouetté / raccord
  textOut: bez(.4, 0, 1, 1),
};
const E = {
  lin: t => t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  over: t => { const c1 = 1.1, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const P = (t, a, d, e = E.lin) => e(clamp((t - a) / d));
/* apparition « pop » : 0,92 → 1,03 → 1 en 350 ms */
function popv(t, a, d = .35) {
  const p = clamp((t - a) / d);
  if (p <= 0) return { s: .92, o: 0 };
  const s = p < .55 ? lerp(.92, 1.03, E.outCubic(p / .55)) : lerp(1.03, 1, E.inOutSine((p - .55) / .45));
  return { s, o: clamp(p / .3) };
}
function pop(el, t, a, extra = '') { const v = popv(t, a); el.style.transform = `${extra} scale(${v.s})`; el.style.opacity = v.o; }
function hide(el, h) { el.style.display = h ? 'none' : ''; }
function blur(el, b, br = 1) {
  const f = (b > .05 ? `blur(${b.toFixed(2)}px) ` : '') + (br < .999 ? `brightness(${br.toFixed(3)})` : '');
  el.style.filter = f || 'none';
}
const mixRGB = (a, b, p) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], p))).join(',')})`;
function toggle(el, p, off = [217, 218, 221], on = [22, 131, 90]) {
  el.style.background = mixRGB(off, on, p);
  const w = el.offsetWidth, k = el.firstElementChild, kw = k.offsetWidth;
  k.style.transform = `translateX(${(w - kw - (w > 40 ? 6 : 4)) * p}px)`;
}
const nf2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

/* caméra : point visé (x, y), échelle s, rotations ; perspective portée par la scène */
function camTF(c) {

function prepWords(el) {
  const words = [];
  const walk = (node, tin) => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/([ \t\n\r]+)/).forEach(p => {
          if (!p) return;
          if (/^[ \t\n\r]+$/.test(p)) { frag.appendChild(document.createTextNode(' ')); return; }
          const w = document.createElement('span'); w.className = 'wd'; w.textContent = p; frag.appendChild(w);
          words.push({ el: w, tin });
        });
        n.replaceWith(frag);
      } else if (n.nodeType === 1 && n.tagName !== 'BR' && n.namespaceURI === 'http://www.w3.org/1999/xhtml') {
        walk(n, n.dataset && n.dataset.tin ? +n.dataset.tin : tin);
      }
    });
  };
  walk(el, null);
  return words;
}
/* entrée : 500 ms par mot, 50 ms d'écart, y +24 → 0, flou 8 → 0 ; sortie : d'un bloc, 250 ms, y → −8 */
function textGroup(el, words, t, tin, tout) {
  if (t < tin - .01 || t > tout + .3) { el.style.opacity = 0; return; }
  const q = P(t, tout, .25, C.textOut);
  el.style.transform = `translateY(${-8 * q}px)`;
  el.style.opacity = 1 - q;
  let iBase = 0, lastTin;
  words.forEach((w, i) => {
    const base = w.tin ?? tin;
    if (base !== lastTin) { iBase = i; lastTin = base; }
    const p = P(t, base + (i - iBase) * .05, .5, C.iso);
    w.el.style.transform = `translateY(${24 * (1 - p)}px)`;
    w.el.style.filter = p < .999 ? `blur(${(8 * (1 - p)).toFixed(2)}px)` : 'none';
    w.el.style.opacity = p;
  });
}
